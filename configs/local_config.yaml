## REQUIRED KEYS
model: "qwen2.5:7b" # local model name, key required

system_prompt: "prompt/system.txt" # key required

spec_prompt: "prompt/spec.txt" # key required
question_prompt: "prompt/question.txt" # key required

spec_path: "workspace/ASSISTANT.md"  # key required

profiles_dir: "profiles" # key required, relative to this file's directory

default_profile: "wu" # key required, name of a file in profiles_dir (without .yaml)

## OPTIONAL KEYS

# agents_path: "agents/agent.yaml" # optional: multi-agent graph relative to this file's directory

spec_think: false # optional: false disable model reasoning for spec updates (faster, less careful)

llm_settings: # optional: model options passed to the LLM client (temperature, top_p...)
  temperature: 0
