[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-wu"
version = "0.1.0"
description = "An master-wu harness for AI agents"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Armand Lecomte", email = "armand.lecomte@epitech.eu" },
    { name = "Rayan Ouerdane", email = "rayan.ouerdane@epitech.eu" },
    { name = "Sacha Lemée", email = "sacha.lemee@epitech.eu" },
]
dynamic = ["dependencies"]

[project.scripts]
wu = "interfaces.cli.main:main"
wu-api = "interfaces.api.server:main"
wu-compare = "interfaces.compare.main:main"

[project.optional-dependencies]
monitoring = ["jupyter", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
